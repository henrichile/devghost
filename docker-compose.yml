services:
  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.http.middlewares.backend-timeout.buffering.maxRequestBodyBytes=0"
      - "traefik.http.middlewares.backend-timeout.buffering.maxResponseBodyBytes=0"
    networks:
      - app-network

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
